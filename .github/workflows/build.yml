name: Build MoxyTV APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build APK via Docker
        run: |
          # 1. 赋予执行权限
          chmod +x build.sh
          
          # 2. 构建项目自带的 Docker 打包镜像（内置完整 aapt/apktool 环境）
          docker build -t website-to-apk .
          
          # 3. 运行容器打包 moxy.sx
          docker run --rm -v "${{ github.workspace }}:/app" -w /app website-to-apk ./build.sh "https://moxy.sx"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoxyTV-Release-APK
          path: |
            *.apk
            **/*.apk
