name: Build MoxyTV APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt zipalign apktool curl wget

      - name: Build Moxy APK
        run: |
          chmod +x build.sh
          ./build.sh -n "MoxyTV" -p "com.moxy.tv" https://moxy.sx

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoxyTV-Release-APK
          path: |
            *.apk
            output/*.apk
            build/*.apk
