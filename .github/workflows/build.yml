name: Build MoxyTV APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Android Tools & Apktool
        run: |
          # 1. 启用 GitHub 预装的最新 Android build-tools (包含 aapt, zipalign, apksigner)
          LATEST_BUILD_TOOLS=$(ls -d /usr/local/lib/android/sdk/build-tools/* | sort -V | tail -n 1)
          echo "$LATEST_BUILD_TOOLS" >> $GITHUB_PATH

          # 2. 安装 apktool 依赖脚本与核心 jar
          sudo wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          sudo wget -q https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -O /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar

      - name: Execute Build Script
        run: |
          chmod +x build.sh
          # 执行打包并传入参数
          ./build.sh -n "MoxyTV" "https://moxy.sx" || ./build.sh "https://moxy.sx"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoxyTV-APK
          path: |
            *.apk
            **/*.apk
